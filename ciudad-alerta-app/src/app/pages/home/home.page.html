<ion-header class="cabecera" [translucent]="true">
  <ion-toolbar>
    <ion-title>Ciudad Alerta</ion-title>
    <ion-buttons slot="end">
      <app-ranura nombre="cabecera.acciones" />
      <app-theme-toggle></app-theme-toggle>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="inicio-content" [fullscreen]="true">
  <div class="inicio-shell">
    @if (usuario(); as user) {
      <section class="sesion">
        <ion-icon name="person-circle-outline" aria-hidden="true"></ion-icon>
        <div>
          <p class="sesion__saludo">{{ saludo() }}</p>
          <p class="sesion__email">{{ user.email }}</p>
        </div>
      </section>

      <!--
        Lo llenan los módulos: el recordatorio de verificar el correo (Mi
        perfil) y el nivel de confianza, por ejemplo.
      -->
      <app-ranura nombre="inicio.resumen" [entradas]="{ perfil: perfil() }" />

      <nav class="accesos">
        @for (acceso of accesos(); track acceso.id) {
          <ion-button
            expand="block"
            [routerLink]="acceso.ruta"
            [fill]="acceso.estilo === 'principal' || acceso.estilo === 'gestion' ? 'solid' : 'outline'"
            [class.accion-reportar]="acceso.estilo === 'principal'"
            [class.accion-staff]="acceso.estilo === 'gestion'"
          >
            <ion-icon slot="start" [name]="acceso.icono" aria-hidden="true"></ion-icon>
            {{ modulos.texto(acceso, perfil()?.role ?? null) }}
          </ion-button>
        }
      </nav>

      <app-cerrar-sesion />
    }

    <app-version-demo />
  </div>
</ion-content>
