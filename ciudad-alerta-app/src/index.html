<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Ciudad Alerta</title>

    <base href="/" />

    <!--
      BUG 46 y v2-B5 · Sin user-scalable, sin minimum-scale y sin maximum-scale.
      Cualquiera de los tres limita el zoom e incumple la pauta WCAG 1.4.4, que
      exige poder ampliar el contenido hasta el 200%.
    -->
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="description"
      content="Ciudad Alerta: reporta incidencias urbanas con foto y ubicación, y sigue su estado."
    />
    <meta name="theme-color" content="#111827" />

    <!--
      Aplica el tema guardado antes de que arranque Angular. Sin esto, quien
      eligió el tema claro vería un destello del oscuro mientras la aplicación
      carga, porque ThemeService solo existe una vez iniciado el framework.
      Replica la lógica de leerPreferencia() en theme.service.ts.
    -->
    <script>
      (function () {
        var tema;
        try {
          tema = localStorage.getItem('ciudad-alerta.tema');
        } catch (e) {}
        if (tema !== 'claro' && tema !== 'oscuro') {
          tema =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'claro'
              : 'oscuro';
        }
        if (tema === 'claro') {
          document.documentElement.classList.add('tema-claro');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#f8fafc');
        }

        // Preferencias de Configuración que cambian cómo se ve la app (tamaño
        // del texto y animaciones), por la misma razón. Replica aplicar() en
        // services/preferencias.service.ts.
        var preferencias = {};
        try {
          preferencias = JSON.parse(localStorage.getItem('ciudad-alerta.preferencias') || '{}') || {};
        } catch (e) {}
        var raiz = document.documentElement.classList;
        if (preferencias.animaciones === 'no') raiz.add('ca-sin-animaciones');
        if (preferencias.animaciones === 'si') raiz.add('ca-con-animaciones');
        if (preferencias.texto === 'grande') raiz.add('ca-texto-grande');
        if (preferencias.texto === 'muy-grande') raiz.add('ca-texto-muy-grande');
      })();
    </script>

    <!--
      Pantalla de arranque: se ve desde que abre la app hasta que la primera
      pantalla tiene todo listo (ArranqueService la quita con un fundido). Sin
      ella se veía un fondo vacío y luego cada parte del inicio por separado.
      Los estilos van aquí porque deben estar antes que el resto de la app.
    -->
    <style>
      #arranque {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #111827;
        color: #f8fafc;
        font-family: var(--ion-font-family, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
        transition: opacity 0.35s ease;
      }
      html.tema-claro #arranque {
        background: #f8fafc;
        color: #111827;
      }
      #arranque.arranque--fuera {
        opacity: 0;
        pointer-events: none;
      }
      .arranque__marca {
        width: 64px;
        height: 64px;
        color: #1ca9c9;
      }
      html.tema-claro .arranque__marca {
        color: #0e7490;
      }
      .arranque__nombre {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .arranque__barra {
        position: relative;
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
      }
      html.tema-claro .arranque__barra {
        background: rgba(17, 24, 39, 0.1);
      }
      .arranque__barra::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 3px;
        background: #1ca9c9;
        animation: arranque-barra 1.1s ease-in-out infinite;
      }
      @keyframes arranque-barra {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
      html.ca-sin-animaciones .arranque__barra::after {
        animation: none;
        width: 100%;
        opacity: 0.5;
      }
      @media (prefers-reduced-motion: reduce) {
        html:not(.ca-con-animaciones) .arranque__barra::after {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>

    <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

    <!--
      v2-B6 · Se retiran las metas de aplicación web progresiva. Prometían una
      instalación que el navegador no puede completar: no hay manifest, ni
      service worker, ni iconos enlazados. La distribución móvil del proyecto es
      el APK generado con Capacitor; convertir el portal en PWA queda declarado
      como evolución futura y exigiría añadir @angular/pwa.
    -->
  </head>

  <body>
    <div id="arranque" role="status" aria-label="Cargando Ciudad Alerta">
      <svg class="arranque__marca" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M32 59s19-17.8 19-33a19 19 0 1 0-38 0c0 15.2 19 33 19 33z" />
        <path d="M32 16v13" />
        <circle cx="32" cy="36.5" r="1.2" fill="currentColor" />
      </svg>
      <p class="arranque__nombre">Ciudad Alerta</p>
      <div class="arranque__barra"></div>
    </div>
    <script>
      // Si algo falla antes de que la app la quite, no debe tapar la pantalla.
      setTimeout(function () {
        var arranque = document.getElementById('arranque');
        if (arranque) arranque.remove();
      }, 8000);
    </script>
    <app-root></app-root>
  </body>
</html>
