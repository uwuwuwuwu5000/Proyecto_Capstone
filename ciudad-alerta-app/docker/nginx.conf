server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular es una aplicación de página única: cualquier ruta que no
    # corresponda a un archivo real debe devolver index.html para que el router
    # del navegador resuelva la navegación. Sin esto, recargar en /map da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre no cambian nunca: se cachean un año.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html no se cachea: es el que apunta a las versiones nuevas de los
    # demás archivos tras cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    # Tamaño máximo de carga; las fotografías viajan por el SDK de Firebase,
    # no por este servidor, así que un límite bajo es suficiente.
    client_max_body_size 2m;
}
